# The Windows install, end to end, on a machine nobody has touched.
#
# Every Windows bug so far was found by a real person on a real PC, one per
# round trip: an em dash PowerShell read as a quote, a pg_ctl that hung
# forever, a database the second half of the installer could not see. None of
# them needed a person to find. This does what that person did.
#
# The tarball is built on Linux, the way a release is, and unpacked into a
# folder with a space and "(1)" in its name, the way a browser saves a second
# download. The runner's own PostgreSQL is hidden so the installer takes the
# download-everything path; Python is left, because the first real machine had
# it from winget.
#
# `shell: powershell` is Windows PowerShell 5.1 -- the one that misreads a
# BOM-less script -- not pwsh. That is the point.

name: windows install

on:
  push:
  workflow_dispatch:

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  install:
    needs: sdist
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: sdist

      # The runner ships a PostgreSQL service, puts it under Program Files and
      # sets PGUSER/PGPASSWORD/PGDATA/PGBIN/PGROOT machine-wide. A real first
      # machine has none of that, and every one of those would change which
      # path the installer takes.
      - name: Hide the runner's PostgreSQL
        run: |
          Get-Service postgresql* -ErrorAction SilentlyContinue | Stop-Service -Force
          if (Test-Path 'C:\Program Files\PostgreSQL') {
            Rename-Item 'C:\Program Files\PostgreSQL' 'PostgreSQL-hidden'
          }
          foreach ($v in 'PGUSER','PGPASSWORD','PGDATA','PGBIN','PGROOT','PGHOST','PGPORT') {
            [Environment]::SetEnvironmentVariable($v, $null, 'Machine')
            "$v=" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          }
          if (Get-Command psql.exe -ErrorAction SilentlyContinue) { throw 'psql is still visible' }

      - name: Unpack where a browser would have saved it
        run: |
          $dir = Join-Path $env:USERPROFILE 'Downloads\renewal (1)'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $tarball = (Get-ChildItem sdist\*.tar.gz)[0].FullName
          tar -xzf $tarball -C $dir
          $app = (Get-ChildItem $dir -Directory)[0].FullName
          "APP=$app" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # `echo.|` answers install.cmd's closing `pause`, and leaves stdin
      # redirected -- which is how the .exe runs it too, so the account prompt
      # is skipped exactly as it is there.
      - name: install.cmd
        timeout-minutes: 30
        run: |
          foreach ($v in 'PGUSER','PGPASSWORD','PGDATA','PGBIN','PGROOT','PGHOST','PGPORT') { Remove-Item "Env:$v" -ErrorAction SilentlyContinue }
          Set-Location $env:APP
          cmd /c "echo.| install.cmd"
          if ($LASTEXITCODE -ne 0) { throw "install.cmd exited $LASTEXITCODE" }

      - name: install.cmd again, as somebody retrying would
        timeout-minutes: 10
        run: |
          foreach ($v in 'PGUSER','PGPASSWORD','PGDATA','PGBIN','PGROOT','PGHOST','PGPORT') { Remove-Item "Env:$v" -ErrorAction SilentlyContinue }
          Set-Location $env:APP
          cmd /c "echo.| install.cmd"
          if ($LASTEXITCODE -ne 0) { throw "install.cmd exited $LASTEXITCODE" }

      # No key: the application must come up without one now, and /setup is
      # where one would go. Plain-http sign-in for the checks below, and no
      # update check against GitHub from CI.
      - name: An account, and no key
        run: |
          Set-Location $env:APP
          $envFile = Join-Path $env:APP '.env'
          $lines = @(Get-Content $envFile) + @('SESSION_COOKIE_SECURE=false', 'UPDATE_CHECK=false')
          [IO.File]::WriteAllText($envFile, ($lines -join "`r`n") + "`r`n", (New-Object Text.UTF8Encoding $false))
          $py = @'
          from sqlalchemy.orm import sessionmaker
          from renewal.db import get_engine
          from scripts.add_user import upsert_user
          session = sessionmaker(bind=get_engine())()
          upsert_user(session, "ci@example.com", "ci-password-long-enough", "CI")
          session.commit()
          '@
          Set-Content -Path ci_user.py -Value $py -Encoding ASCII
          .venv\Scripts\python ci_user.py
          if ($LASTEXITCODE -ne 0) { throw 'could not create the account' }

      - name: Start it the way the desktop icon does
        timeout-minutes: 5
        run: |
          Set-Location $env:APP
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\start.ps1 -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw "start.ps1 exited $LASTEXITCODE" }

      - name: Sign in
        run: |
          $r = Invoke-WebRequest http://127.0.0.1:8000/login -UseBasicParsing
          if ($r.StatusCode -ne 200) { throw "login page: $($r.StatusCode)" }
          try {
            $r = Invoke-WebRequest http://127.0.0.1:8000/login -Method Post -UseBasicParsing `
              -Headers @{ Origin = 'http://127.0.0.1:8000' } -MaximumRedirection 0 `
              -Body @{ email = 'ci@example.com'; password = 'ci-password-long-enough' } -ErrorAction Stop
            $status = $r.StatusCode
          } catch {
            $status = [int]$_.Exception.Response.StatusCode
          }
          if ($status -ne 303 -and $status -ne 302) { throw "sign-in answered $status, not a redirect" }

      - name: Setup page, with nothing set up
        run: |
          $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          Invoke-WebRequest http://127.0.0.1:8000/login -Method Post -UseBasicParsing -WebSession $s `
            -Headers @{ Origin = 'http://127.0.0.1:8000' } `
            -Body @{ email = 'ci@example.com'; password = 'ci-password-long-enough' } | Out-Null
          $page = Invoke-WebRequest http://127.0.0.1:8000/setup -UseBasicParsing -WebSession $s
          if ($page.Content -notmatch 'Not set up') { throw 'the setup page did not render its cards' }
          $inbox = Invoke-WebRequest http://127.0.0.1:8000/inbox -UseBasicParsing -WebSession $s
          if ($inbox.Content -notmatch 'Finish setup') { throw 'no setup banner' }

      # The path the icon takes the morning after: the machine was switched
      # off, so the database is down and start.ps1 has to bring it up. That is
      # the pg_ctl call that used to hang.
      - name: Start again after a reboot
        timeout-minutes: 5
        run: |
          Set-Location $env:APP
          Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force
          & runtime\pgsql\bin\pg_ctl.exe -D runtime\pgdata stop -m fast
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\start.ps1 -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw "start.ps1 exited $LASTEXITCODE" }
          $r = Invoke-WebRequest http://127.0.0.1:8000/login -UseBasicParsing
          if ($r.StatusCode -ne 200) { throw "login page: $($r.StatusCode)" }

      - name: Logs
        if: always()
        run: |
          foreach ($f in 'runtime\install.log', 'runtime\postgres.log', 'runtime\pg_ctl.out', 'runtime\pg_ctl.err') {
            $p = Join-Path $env:APP $f
            "===== $f"
            if (Test-Path $p) { Get-Content $p -Tail 200 } else { '(missing)' }
          }

  # The .exe is what somebody is actually handed. It runs the same scripts
  # with no console at all -- nsExec pipes their output -- which is exactly
  # the condition both the pg_ctl hang and the lost log depended on.
  exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q nsis
      - run: python -m pip install build && ./packaging/build-installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: setup-exe
          path: dist/Renewal-*-setup.exe

  install-exe:
    needs: exe
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: setup-exe
          path: setup

      - name: Hide the runner's PostgreSQL
        run: |
          Get-Service postgresql* -ErrorAction SilentlyContinue | Stop-Service -Force
          if (Test-Path 'C:\Program Files\PostgreSQL') {
            Rename-Item 'C:\Program Files\PostgreSQL' 'PostgreSQL-hidden'
          }
          foreach ($v in 'PGUSER','PGPASSWORD','PGDATA','PGBIN','PGROOT','PGHOST','PGPORT') {
            [Environment]::SetEnvironmentVariable($v, $null, 'Machine')
            "$v=" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          }
          "APP=$env:LOCALAPPDATA\Renewal" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # WaitForExit, not Start-Process -Wait: on 5.1 -Wait waits for every
      # descendant too, and the database the installer starts is one.
      - name: Run the .exe silently
        timeout-minutes: 30
        run: |
          foreach ($v in 'PGUSER','PGPASSWORD','PGDATA','PGBIN','PGROOT','PGHOST','PGPORT') { Remove-Item "Env:$v" -ErrorAction SilentlyContinue }
          $exe = (Get-ChildItem setup\Renewal-*-setup.exe)[0].FullName
          $p = Start-Process -FilePath $exe -ArgumentList '/S' -PassThru
          $null = $p.Handle
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { throw "the installer exited $($p.ExitCode)" }
          if (-not (Test-Path "$env:APP\.venv\Scripts\python.exe")) { throw 'no .venv: setup did not run to the end' }

      # No key, as above; the update check points at a feed this job serves
      # itself, so the button can be pressed for real.
      - name: An account, and no key
        run: |
          Set-Location $env:APP
          $envFile = Join-Path $env:APP '.env'
          $lines = @(Get-Content $envFile) + @('SESSION_COOKIE_SECURE=false', 'UPDATE_API_URL=http://127.0.0.1:8765/latest.json')
          [IO.File]::WriteAllText($envFile, ($lines -join "`r`n") + "`r`n", (New-Object Text.UTF8Encoding $false))
          $py = @'
          from sqlalchemy.orm import sessionmaker
          from renewal.db import get_engine
          from scripts.add_user import upsert_user
          session = sessionmaker(bind=get_engine())()
          upsert_user(session, "ci@example.com", "ci-password-long-enough", "CI")
          session.commit()
          '@
          Set-Content -Path ci_user.py -Value $py -Encoding ASCII
          .venv\Scripts\python ci_user.py
          if ($LASTEXITCODE -ne 0) { throw 'could not create the account' }

      - name: Start it from the desktop shortcut
        timeout-minutes: 5
        run: |
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Renewal.lnk'
          if (-not (Test-Path $lnk)) { throw 'no desktop shortcut' }
          $s = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          $p = Start-Process -FilePath $s.TargetPath -ArgumentList "$($s.Arguments) -NoBrowser" -WorkingDirectory $s.WorkingDirectory -PassThru
          $null = $p.Handle
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { throw "the shortcut's script exited $($p.ExitCode)" }
          $r = Invoke-WebRequest http://127.0.0.1:8000/login -UseBasicParsing
          if ($r.StatusCode -ne 200) { throw "login page: $($r.StatusCode)" }

      # The button's whole path: the check finds a "newer" release on a local
      # server, the app downloads and verifies it, spawns update.ps1 from its
      # own process tree, and is stopped, reinstalled and started by it.
      - name: One-click update
        timeout-minutes: 30
        run: |
          $exe = (Get-ChildItem setup\Renewal-*-setup.exe)[0]
          $feed = Join-Path $env:RUNNER_TEMP 'feed'
          New-Item -ItemType Directory -Force -Path $feed | Out-Null
          Copy-Item $exe.FullName (Join-Path $feed 'Renewal-99.0.0-setup.exe')
          $hash = (Get-FileHash (Join-Path $feed 'Renewal-99.0.0-setup.exe') -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText((Join-Path $feed 'SHA256SUMS'), "$hash  Renewal-99.0.0-setup.exe`n")
          $json = @{ tag_name = 'v99.0.0'; html_url = 'http://127.0.0.1:8765/'; assets = @(
            @{ name = 'Renewal-99.0.0-setup.exe'; browser_download_url = 'http://127.0.0.1:8765/Renewal-99.0.0-setup.exe' },
            @{ name = 'SHA256SUMS'; browser_download_url = 'http://127.0.0.1:8765/SHA256SUMS' }) } | ConvertTo-Json -Depth 4
          [IO.File]::WriteAllText((Join-Path $feed 'latest.json'), $json)
          Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1' -WorkingDirectory $feed -WindowStyle Hidden

          # Restart so the clock checks the local feed at start.
          Set-Location $env:APP
          Get-CimInstance Win32_Process -Filter "Name='python.exe'" |
            Where-Object { $_.CommandLine -like '*uvicorn*' } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep 2
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\start.ps1 -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw 'restart failed' }

          $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          Invoke-WebRequest http://127.0.0.1:8000/login -Method Post -UseBasicParsing -WebSession $s `
            -Headers @{ Origin = 'http://127.0.0.1:8000' } `
            -Body @{ email = 'ci@example.com'; password = 'ci-password-long-enough' } | Out-Null
          $deadline = (Get-Date).AddSeconds(90)
          do {
            Start-Sleep 2
            $page = Invoke-WebRequest http://127.0.0.1:8000/setup -UseBasicParsing -WebSession $s
          } until ($page.Content -match 'Update now' -or (Get-Date) -gt $deadline)
          if ($page.Content -notmatch 'Update now') {
            $page.Content -split "`n" | Select-String -Pattern 'pdate|Couldn' | Select-Object -First 10
            throw 'the update was never offered'
          }

          $r = Invoke-WebRequest http://127.0.0.1:8000/setup/update -Method Post -UseBasicParsing `
            -WebSession $s -Headers @{ Origin = 'http://127.0.0.1:8000' }
          if ($r.Content -notmatch 'Updating to 99.0.0') { throw 'the button did not hand off' }

          $log = Join-Path $env:APP 'runtime\update.log'
          $deadline = (Get-Date).AddMinutes(20)
          while (-not ((Test-Path $log) -and (Select-String -Path $log -Pattern 'start exited' -Quiet))) {
            if ((Get-Date) -gt $deadline) { throw 'update.log never finished' }
            Start-Sleep 5
          }
          Get-Content $log -Tail 40
          if (-not (Select-String -Path $log -Pattern 'installer exited 0' -Quiet)) { throw 'the installer failed' }
          if (-not (Get-ChildItem (Join-Path $env:APP 'runtime\backups\*.dump'))) { throw 'no backup was made' }
          $r = Invoke-WebRequest http://127.0.0.1:8000/login -UseBasicParsing
          if ($r.StatusCode -ne 200) { throw 'not back up after the update' }

      - name: Logs
        if: always()
        run: |
          foreach ($f in 'runtime\install.log', 'runtime\postgres.log', 'runtime\pg_ctl.out', 'runtime\pg_ctl.err', 'runtime\update.log') {
            $p = Join-Path $env:APP $f
            "===== $f"
            if (Test-Path $p) { Get-Content $p -Tail 200 } else { '(missing)' }
          }
