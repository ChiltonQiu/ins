[project]
name = "renewal"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pymupdf>=1.24",
  "anthropic>=0.40",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "cryptography>=42",
  "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# Declared explicitly: `evals`, `migrations`, and `config` sit at the top level
# but are not part of the distribution, and setuptools refuses to guess between
# them.
[tool.setuptools]
packages = [
  "renewal", "renewal.extract", "renewal.text", "renewal.resolve",
  "renewal.dates", "renewal.calendarview", "renewal.web",
]

[tool.setuptools.package-data]
# static/* rather than static/*.js: the only static file today is a
# stylesheet, so the narrower glob shipped a wheel with no CSS.
renewal = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
markers = [
  "eval: hits the real model provider API; excluded from the default run",
  "ocr: needs the system tesseract binary",
]
addopts = "-m 'not eval'"
testpaths = ["tests", "evals"]
pythonpath = ["."]
